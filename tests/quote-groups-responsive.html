<!doctype html><html lang="hu"><meta charset="utf-8"><title>Főtételek – reszponzív ellenőrzés</title><style>body{margin:0;background:#deddd8;font:13px Arial}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:block;border:0;height:1800px;margin:auto}</style><pre id="results">Ellenőrzés…</pre><iframe title="Főtételek elkülönített ellenőrzése"></iframe><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe');frame.style.width=(Number(params.get('width'))||390)+'px';frame.style.height=(Number(params.get('height'))||844)+'px';const nested=new URLSearchParams();if(params.has('preview'))nested.set('preview','');if(params.has('compact'))nested.set('compact','');frame.src='quote-groups.html?'+nested;const timer=setInterval(()=>{const report=frame.contentDocument?.querySelector('#results');if(report?.dataset.failed!==undefined){document.querySelector('#results').textContent=report.textContent;clearInterval(timer);if(params.has('preview'))document.querySelector('#results').hidden=true;window.scrollTo(0,0)}},100);
</script></html>
