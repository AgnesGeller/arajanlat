<!doctype html><html lang="hu"><meta charset="utf-8"><title>Gyors ajánlat – reszponzív próba</title><style>body{margin:0;background:#deddd8;font:13px Arial}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:block;border:0;height:1600px;margin:auto}</style><pre id="results">Ellenőrzés…</pre><iframe title="Elkülönített gyorsajánlat-próba"></iframe><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe');frame.style.width=(Number(params.get('width'))||390)+'px';frame.src='quick-quote.html'+(params.has('preview')?'?preview':'');
const timer=setInterval(()=>{const report=frame.contentDocument?.querySelector('#results');if(report?.dataset.failed!==undefined){document.querySelector('#results').textContent=report.textContent;clearInterval(timer);if(params.has('preview'))document.querySelector('#results').hidden=true;window.scrollTo(0,0)}},50);
</script></html>
